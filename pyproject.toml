[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owlpath-pipeline"
version = "0.1.0"
description = "Builds OwlPath's course dataset from the KSU catalog"
requires-python = ">=3.13"
dependencies = ["requests", "beautifulsoup4", "jsonschema", "pypdf"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["owlpath_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
