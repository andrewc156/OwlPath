name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main] # main is tested by the deploy workflow, which calls this one
  workflow_call:

permissions:
  contents: read

jobs:
  pipeline:
    name: Data pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest

  web:
    name: Web app (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # Fails unless data/2026-2027/courses.json exists and isn't the sample.
      - run: npm run build
